[package]
name = "termui-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ratatui = { version = "0.30", default-features = false }
termui-renderer = { path = "../termui-renderer" }
termui-widgets = { path = "../termui-widgets" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
critical-section = { version = "1.2", features = ["std"] }
ratzilla = "0.3.1"
strum = { version = "0.28", features = ["derive"] }

[[bin]]
name = "render-demos"
path = "src/main.rs"

[[bin]]
name = "button-interactive"
path = "src/demos/demo_button_interactive.rs"

[[bin]]
name = "dialog-interactive"
path = "src/demos/demo_dialog_interactive.rs"

[[bin]]
name = "resizable-layout-interactive"
path = "src/demos/demo_resizable_layout_interactive.rs"

[[bin]]
name = "text-input-interactive"
path = "src/demos/demo_text_input_interactive.rs"
