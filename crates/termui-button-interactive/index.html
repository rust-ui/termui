<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <title>Interactive Ratatui Button</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        font-size: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #09090b;
      }

      #terminal {
        width: 100%;
        height: 320px;
        padding: 12px;
        overflow: hidden;
        color: #fafafa;
        background: #09090b;
        line-height: 20px;
      }

      #terminal pre {
        height: 20px;
        margin: 0;
        line-height: 20px;
        white-space: pre;
      }

      #terminal_ratzilla_grid {
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
  </body>
</html>
