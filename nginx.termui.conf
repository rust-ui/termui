server {
    listen 80;
    server_name termui.rs www.termui.rs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name termui.rs www.termui.rs;

    ssl_certificate     /etc/letsencrypt/live/termui.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termui.rs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location = /health {
        proxy_pass http://127.0.0.1:5103/api/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
